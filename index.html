<div id="auth-screen" style="display:none;position:fixed;inset:0;background:#121212;z-index:9998;flex-direction:column;align-items:center;justify-content:center;padding:24px;font-family:Urbanist,sans-serif;">
  <img src="icon.svg" width="60" height="60" alt="Logo" style="border-radius:16px;margin-bottom:20px;">
  <h1 style="color:#fff;font-size:32px;margin-bottom:8px;text-align:center;">Welcome to FitStreak</h1>
  <p style="color:#9a9aa0;margin-bottom:30px;text-align:center;">Your voice. Your health.</p>
  
  <div style="width:100%;max-width:360px;">
    <input id="auth-email" type="email" placeholder="Email address" style="width:100%;padding:16px;border-radius:14px;border:1px solid #333336;background:#2a2a2d;color:#fff;font-size:16px;margin-bottom:12px;outline:none;">
    <input id="auth-pass" type="password" placeholder="Password (min 6 chars)" style="width:100%;padding:16px;border-radius:14px;border:1px solid #333336;background:#2a2a2d;color:#fff;font-size:16px;margin-bottom:20px;outline:none;">
    
    <button id="auth-btn-main" onclick="window.authBtnClick()" style="width:100%;padding:16px;border-radius:99px;background:#ececee;color:#121212;font-weight:800;font-size:16px;border:none;margin-bottom:16px;">Login</button>
    
    <div style="text-align:center;margin-bottom:20px;">
      <span id="auth-toggle" onclick="window.authToggle()" style="color:#9d8cff;font-size:14px;cursor:pointer;font-weight:600;">Don't have an account? Sign up</span>
    </div>
    
    <div style="display:flex;align-items:center;margin-bottom:20px;"><hr style="flex:1;border:none;border-top:1px solid #333336;"><span style="padding:0 10px;color:#9a9aa0;font-size:12px;">OR</span><hr style="flex:1;border:none;border-top:1px solid #333336;"></div>
    
    <button id="auth-google" onclick="window.auth.signInWithGoogle()" style="width:100%;padding:16px;border-radius:99px;background:transparent;border:1px solid #444;color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;">
      <img src="https://www.google.com/favicon.ico" width="18" height="18"> Continue with Google
    </button>
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const btn = document.getElementById('auth-btn-main'), toggle = document.getElementById('auth-toggle');
  const email = document.getElementById('auth-email'), pass = document.getElementById('auth-pass');
  let isLogin = true;

  toggle.onclick = () => {
    isLogin = !isLogin;
    btn.textContent = isLogin ? 'Login' : 'Sign Up';
    toggle.textContent = isLogin ? "Don't have an account? Sign up" : "Already have an account? Login";
  };

  btn.onclick = async () => {
    if(!email.value || !pass.value) return alert('Please enter email and password');
    btn.textContent = 'Please wait...';
    try {
      if(isLogin) await window.auth.signInEmail(email.value, pass.value);
      else await window.auth.signUpEmail(email.value, pass.value);
    } catch(e) { alert(e.message); }
    btn.textContent = isLogin ? 'Login' : 'Sign Up';
  };

  document.getElementById('auth-google').onclick = () => window.auth.signInWithGoogle();
});
</script>

function saveCurrentChat() {
  if (chat.length === 0) return;
  let title = chat.find(m => m.r === 'u')?.t || 'New Chat';
  if (title.length > 30) title = title.slice(0, 30) + '...';
  
  if (activeChatId) {
    const c = db.chats.find(x => x.id === activeChatId);
    if (c) { c.msgs = [...chat]; c.title = title; }
  } else {
    activeChatId = Date.now().toString();
    db.chats.unshift({ id: activeChatId, title, msgs: [...chat], ts: Date.now() });
  }
  save();
}
function loadChat(id) {
  const c = db.chats.find(x => x.id === id);
  if (c) {
    activeChatId = id;
    chat = [...c.msgs];
    document.getElementById('chat-sidebar').style.display = 'none';
    if(V !== 'coach') go('coach'); else render();
  }
}

window.renameChat = (id) => {
  const c = db.chats.find(x => x.id === id);
  if (!c) return;
  window.showDialog({
    title: 'Rename Chat',
    input: true,
    defaultValue: c.title,
    onConfirm: (newTitle) => {
      if (newTitle && newTitle.trim()) {
        c.title = newTitle.trim();
        save();
        renderChatList();
      }
    }
  });
};
window.deleteChat = (id) => {
  window.showDialog({
    title: 'Delete Chat',
    message: 'Are you sure you want to delete this chat?',
    onConfirm: () => {
      db.chats = db.chats.filter(x => x.id !== id);
      if (activeChatId === id) {
        activeChatId = null;
        chat = [];
        render();
      }
      save();
      renderChatList();
    }
  });
};

function listen(){said='';rec=new SR();rec.lang=db.lang;rec.interimResults=true;rec.onresult=e=>{said=[...e.results].map(r=>r[0].transcript).join('');$('#vt').textContent=said};
rec.onerror=e=>{if(e.error=='not-allowed'){toast('Please allow microphone access');vClose()}};
rec.onend=()=>{if(!vopen)return;if(said.trim()){idle=0;ask(said)}else if(++idle>=2)vClose();else listen()};$('#vc').classList.add('on');try{rec.start()}catch(e){}}
function speak(s){if(!vopen)return;if(!db.voice)return listen();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s.replace(/\[\d\]/g,''));u.lang=db.lang;u.onend=()=>vopen&&listen();speechSynthesis.speak(u)}
async function ask(t){
$('#vc').classList.remove('on');$('#vs').textContent='Thinking...';
chat.push({r:'u',t});busy=1;
if(V=='coach'){render();setTimeout(()=>window.scrollTo(0,document.body.scrollHeight),10);}
const sb=$('#send-btn'); if(sb) sb.innerHTML='■';

// Smart Keyword Detection
let isAppQuery = /(my|plan|goal|sets|water|log|check|profile|history|streak)/i.test(t);
let isWebQuery = /(price|latest|news|current|weather|who is|what is|where is|how much is|buy|research|information|details)/i.test(t);

let msgs = ['Thinking...'];
if (isAppQuery) msgs = ['Thinking...', 'Checking your profile...', 'Analyzing your data...', 'Preparing answer...'];
else if (isWebQuery) msgs = ['Thinking...', 'Searching web...', 'Fetching sources...', 'Reading links...', 'Summarizing...'];
else msgs = ['Thinking...', 'Finding out...', 'Structuring answer...'];

let stepIdx = 0;
let animInterval = setInterval(() => {
    if (!busy) { clearInterval(animInterval); return; }
    let el = document.getElementById('status-text');
    if (el) {
        stepIdx = Math.min(stepIdx + 1, msgs.length - 1);
        el.textContent = msgs[stepIdx];
    }
}, 1000);

let controller=new AbortController(); window.currentAbort=controller;
let say='Could not reach the server. Please try again.',src=[],fu=[];

try{
await new Promise(r=>setTimeout(r,50));
const r=await api('/api/chat',{uid:db.uid,text:t,ctx:ctx(),hist:chat.slice(-7,-1).map(m=>({r:m.r,t:m.t}))}, {signal: controller.signal});

if(r.status==402){
say='You have reached today\'s free limit. Unlock Pro for unlimited use.';vClose();
sheet(`<h2>Daily limit reached</h2><p class="mu">Pro gives unlimited voice, chat and food scans for a one-time ₹${S.price}.</p><button class="btn" data-a="topay">See Pro</button><button class="ghost" data-a="x">Not now</button>`);
}
else{
const j=await r.json();if(!r.ok)throw 0;
busy=0;run(j.actions||[]);
say=j.say||'Sorry, I could not generate a response. Please try again.';src=j.sources||[];fu=j.followups||[];
}
}catch(e){
if(e.name==='AbortError')say='Stopped.';
else say='Could not reach the server. Please try again.';
} finally {
clearInterval(animInterval);
}

window.currentAbort=null;
busy=0; const sb2=$('#send-btn'); if(sb2) sb2.innerHTML='↑';
chat.push({r:'b',t:say,src,fu});saveCurrentChat();
$('#vs').textContent=say.replace(/\[\d\]/g,'');
if(V=='coach')render();
stt();speak(say)
}
const sendTxt=()=>{if(busy){if(window.currentAbort)window.currentAbort.abort();return;}const i=$('#ci'),t=i&&i.value.trim();if(t&&!busy){i.value='';ask(t)}};
// ---- food scanner ----
function scan(){const i=$d.createElement('input');i.type='file';i.accept='image/*';i.setAttribute('capture','environment');i.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{const im=new Image();im.onload=()=>{const c=$d.createElement('canvas');c.width=800;c.height=Math.round(im.height*800/im.width);c.getContext('2d').drawImage(im,0,0,c.width,c.height);doScan(c.toDataURL('image/jpeg',.72))};im.onerror=()=>toast('Could not read that image');im.src=ev.target.result};r.readAsDataURL(f)};i.click()}
async function doScan(img){toast('Analyzing your meal...');try{const r=await api('/api/scan',{uid:db.uid,image:img});if(r.status==402){sheet(`<h2>Daily limit reached</h2><p class="mu">Unlock Pro for unlimited scans.</p><button class="btn" data-a="topay">See Pro</button>`);return}
const j=await r.json();if(!r.ok)throw 0;if(!j.food)return toast('No food found in that photo');stt();
sheet(`<h2>${esc(j.food)}</h2><small>${esc(j.note||'One typical serving')} · estimate</small><div class="mac"><div><small>Protein</small><b>${j.protein} g</b></div><div><small>Carbs</small><b>${j.carbs} g</b></div><div><small>Fat</small><b>${j.fat} g</b></div></div><small style="margin-top:14px">Calories (edit if needed)</small><input id="sk" class="t" type="number" inputmode="numeric" value="${j.calories}"><button class="btn" data-a="savescan" data-n="${esc(j.food)}" data-p="${j.protein}" data-c="${j.carbs}" data-f="${j.fat}">Add to today</button><button class="ghost" data-a="x">Cancel</button>`)}catch(e){toast('Scan failed. Please try again.')}}
// ---- plan / payment ----
const stt=()=>window.auth.authFetch('/api/status').then(r=>r.json()).then(j=>{const was=S.active;S=j;if(j.active&&!was&&V=='pay')toast('Pro unlocked. Thank you!');if(['home','me','pay'].includes(V))render()}).catch(()=>{});
function addSheet(){const ex=[...new Set(Object.values(db.days).flatMap(d=>(d.sets||[]).map(s=>s.e)).concat(LIB))];sheet(`<h2>Add a set</h2><input id="ae" class="t" list="el" placeholder="Exercise, e.g. Bench Press"><datalist id="el">${ex.map(e=>`<option value="${esc(e)}">`).join('')}</datalist><div class="g2" style="margin:0"><input id="aw" class="t" type="number" inputmode="decimal" placeholder="kg"><input id="ar" class="t" type="number" inputmode="numeric" placeholder="reps"></div><input id="an" class="t" type="number" inputmode="numeric" placeholder="sets" value="1"><button class="btn" data-a="saveset">Save</button>`)}
function welcome(){$d.body.insertAdjacentHTML('beforeend','<div id="wl"><img src="icon.svg" width="60" height="60" alt="" style="border-radius:16px"><h1>Say it.<br>We track it.</h1><ul><li>Log workouts and meals by voice</li><li>Scan food with your camera</li><li>An AI coach that cites its sources</li></ul><input id="wn" class="t" maxlength="24" placeholder="What should we call you?"><button class="btn" data-a="begin">Get started</button><small>By continuing you agree to the Terms and Privacy Policy. AI coaching is general information, not medical advice.</small></div>')}
$d.addEventListener('input',e=>{const t=e.target;if(t.id=='nm'){db.name=nm(t.value);save()}else if(t.id=='cg'){const c=cl(t.value,6000);if(c>=800){db.cal=c;save()}}else if(t.id=='utr')t.value=t.value.replace(/\D/g,'')});
$d.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='ci')sendTxt()});
$d.addEventListener('visibilitychange',()=>{if(!$d.hidden&&V=='pay')stt()});
$d.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const x=t.dataset;({
tab(){go(x.v)},topay(){closeSheet();go('pay')},mic:vOpen,vclose:vClose,theme(){db.theme=db.theme=='dark'?'light':'dark';applyTheme();save()},add:addSheet,x:closeSheet,scan,
saveset(){ACT.log_set({exercise:$('#ae').value,weight:$('#aw').value,reps:$('#ar').value,sets:$('#an').value||1});save();closeSheet();render()},
addmeal(){sheet(`<h2>Add a meal</h2><input id="mn" class="t" placeholder="What did you eat?" maxlength="60"><input id="mk" class="t" type="number" inputmode="numeric" placeholder="Calories"><button class="btn" data-a="savemeal">Save</button>`)},
savemeal(){if(!$('#mn').value.trim())return toast('Enter what you ate');ACT.log_meal({name:$('#mn').value,calories:$('#mk').value});save();closeSheet();render()},
savescan(){ACT.log_meal({name:x.n,calories:$('#sk').value,protein:x.p,carbs:x.c,fat:x.f});save();closeSheet();go('meals')},
del(){window.showDialog({title:'Remove Set',message:'Remove this set?',onConfirm:()=>{day(key()).sets.splice(+x.i,1);save();render()}})},delm(){day(key()).meals.splice(+x.i,1);save();render()},
wat(){ACT.water({n:+x.n});save();render()},slp(){window.showDialog({title:'Log Sleep',message:'Hours slept last night?',input:true,defaultValue:'7',onConfirm:(val)=>{const h=parseFloat(val);if(h>=0){ACT.sleep({hours:h});save();render()}}})},
cal(){sd=x.d;render()},cmo(){cmo+=+x.n;render()},goal(){db.goal=+x.n;save();render()},lang(){db.lang=x.l;save();render()},voice(){db.voice=db.voice?0:1;save();render()},
send:sendTxt,chip(){if(busy)return;if(V!='coach')go('coach');ask(x.q)},newchat(){newChatSession()},
copy(){navigator.clipboard&&navigator.clipboard.writeText(S.upi).then(()=>toast('UPI ID copied'))},refresh(){stt();toast('Checking...')},
async submitpay(){const utr=($('#utr').value||'').replace(/\D/g,''),payer=($('#payer').value||'').trim();if(utr.length!=12)return toast('Enter the 12 digit UTR');if(!payer)return toast('Enter the name on your UPI app');
try{const r=await api('/api/pay',{uid:db.uid,utr,payer}),j=await r.json();if(!r.ok)return toast(j.error||'Could not submit');toast('Submitted. We will verify it soon.');stt()}catch(e){toast('Network problem. Try again.')}},
recover(){window.showDialog({title:'Restore Pro',message:'Enter the 12 digit UTR',input:true,onConfirm:async(val)=>{const utr=(val||'').replace(/\D/g,'');if(utr.length!=12)return toast('Invalid UTR');try{const r=await api('/api/recover',{uid:db.uid,utr}),j=await r.json();toast(r.ok?'Pro restored on this phone':j.error||'Could not restore');stt()}catch(e){toast('Network problem')}}})},
begin(){db.name=nm($('#wn').value)||'Champ';db.ob=1;save();$('#wl').remove();render()},
exp(){const a=$d.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='fitstreak-backup.json';a.click()},
rst(){window.showDialog({title:'Delete All Data',message:'All data will be deleted. Continue?',onConfirm:()=>{db.days={};chat=[];db.chat=[];save();render()}})}})[x.a]?.()});
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
applyTheme();if(!db.ob)welcome();setInterval(()=>{if(V=='home'&&!busy)render()},60000);const tb=new URLSearchParams(location.search).get('tab');if(tb)V={profile:'me',stats:'progress',ai:'coach'}[tb]||tb;if(!views[V])V='home';
</script>
<script>
let isLogin = true;
window.authToggle = () => {
  isLogin = !isLogin;
  document.getElementById('auth-btn-main').textContent = isLogin ? 'Login' : 'Sign Up';
  document.getElementById('auth-toggle').textContent = isLogin ? "Don't have an account? Sign up" : "Already have an account? Login";
};
window.authBtnClick = async () => {
  const email = document.getElementById('auth-email').value;
  const pass = document.getElementById('auth-pass').value;
  const btn = document.getElementById('auth-btn-main');
  if(!email || !pass) return alert('Please enter email and password');
  btn.textContent = 'Please wait...';
  try {
    if(isLogin) await window.auth.signInEmail(email, pass);
    else await window.auth.signUpEmail(email, pass);
  } catch(e) { alert(e.message || "Auth failed"); }
  btn.textContent = isLogin ? 'Login' : 'Sign Up';
};
</script>
<script>setTimeout(()=>{const sp=document.getElementById('splash');if(sp){sp.style.opacity='0';setTimeout(()=>sp.remove(),300)}},3000);</script>
